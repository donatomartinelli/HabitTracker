name: Deploy Cortex PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Two jobs, as in GitHub's own Pages template: "build" uploads the site, "deploy" starts
# only after it. With both in one job, deploy-pages sometimes looked for the artifact in the
# same second it was uploaded and failed with "No artifacts named github-pages were found".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate frontend src folder
        id: locate
        run: |
          if [ -f "src/index.html" ]; then
            echo "dir=src" >> $GITHUB_OUTPUT
          elif [ -f "tracker-widget/src/index.html" ]; then
            echo "dir=tracker-widget/src" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Publish a compressed copy: no comments, no formatting, shorter names.
      # The readable source stays in the repository (see LICENSE: all rights reserved).
      - name: Build compressed site
        run: |
          rm -rf _site && cp -r "${{ steps.locate.outputs.dir }}" _site
          rm -rf _site/.claude
          find _site -type f \( -name "*.js" -o -name "*.css" \) > files.txt
          npx --yes esbuild@0.24.0 $(cat files.txt) --minify --outdir=_site --outbase=_site --allow-overwrite --charset=utf8 --log-level=warning

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5