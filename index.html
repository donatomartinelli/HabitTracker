<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Habit Tracker</title>
    <!-- Richiama il file CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="layout">
        <!-- LEFT: 40% -->
        <div class="left-pane">
            <div class="calendar-section">
                <h1>Overview</h1>
                <br>
                <div class="calendar-header">
                    <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
                    <span id="calendar-month-name">Month Year</span>
                    <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
                </div>
                
                <div class="month-grid" id="calendar-grid"></div>
            </div>

            <div class="tracker-section">
                <h2>Consistency</h2>
                <div class="tracker-wrapper">
                    <div class="tracker-grid" id="github-tracker"></div>
                </div>
            </div>
        </div>

        <!-- RIGHT: 60% -->
        <div class="right-pane">
            <div class="header-actions">
                <h1 id="selected-date-title">Today</h1>
                <div class="header-buttons">
                    <button class="btn btn-event" onclick="openEventModal()">+ Event</button>
                    <button class="btn" onclick="openManagerModal()">⚙ Manage</button>
                    <button class="btn btn-primary" onclick="openFormModal()">+ New Habit</button>
                </div>
            </div>
            <div id="today-tasks"></div>
        </div>
    </div>

    <!-- MODALS & OVERLAYS -->
    
    <!-- Pomodoro Timer Overlay -->
    <div id="pomodoroOverlay" class="pomodoro-overlay">
        <svg class="progress-ring" width="400" height="400">
            <circle stroke="#111" stroke-width="4" fill="transparent" r="180" cx="200" cy="200" />
            <circle id="pomodoro-circle" class="progress-ring__circle" stroke="#ffffff" stroke-width="4" fill="transparent" r="180" cx="200" cy="200" />
        </svg>
        <div class="pomodoro-cancel" onclick="stopPomodoro()">Click anywhere to abort</div>
    </div>

    <!-- Timer Setup Modal -->
    <div id="timerSetupModal" class="modal-overlay">
        <div class="modal-content" style="width: 350px;">
            <h2>Focus Session</h2>
            <form id="timerSetupForm">
                <input type="hidden" id="tmr-task-id">
                <input type="hidden" id="tmr-index">
                <div class="form-group">
                    <label>Duration (Minutes)</label>
                    <input type="number" id="tmr-minutes" class="form-control" min="1" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Start Timer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Habit Form Modal -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Create New Habit</h2>
            <form id="habitForm">
                <input type="hidden" id="h-id">
                <div class="form-group">
                    <label>Category (Calendar)</label>
                    <input type="text" id="h-category" class="form-control" placeholder="e.g. GYM, STUDY" required>
                </div>
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="h-title" class="form-control" placeholder="e.g. Math Session" required>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Repetitions</label>
                        <input type="number" id="h-instances" class="form-control" value="1" min="1" max="50" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Default Timer (min)</label>
                        <input type="number" id="h-timer" class="form-control" value="25" min="1" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Frequency</label>
                    <select id="h-frequency" class="form-control" onchange="toggleDays()">
                        <option value="all">Every day</option>
                        <option value="weekdays">Weekdays (Mon-Fri)</option>
                        <option value="weekends">Weekends (Sat-Sun)</option>
                        <option value="specific">Specific days</option>
                    </select>
                </div>
                <div class="form-group days-checkboxes" id="h-days-container">
                    <label class="day-check"><input type="checkbox" value="1"> Mon</label>
                    <label class="day-check"><input type="checkbox" value="2"> Tue</label>
                    <label class="day-check"><input type="checkbox" value="3"> Wed</label>
                    <label class="day-check"><input type="checkbox" value="4"> Thu</label>
                    <label class="day-check"><input type="checkbox" value="5"> Fri</label>
                    <label class="day-check"><input type="checkbox" value="6"> Sat</label>
                    <label class="day-check"><input type="checkbox" value="0"> Sun</label>
                </div>
                <div class="form-group">
                    <label>End date (optional)</label>
                    <input type="date" id="h-enddate" class="form-control">
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Specific Event Modal -->
    <div id="eventModal" class="modal-overlay">
        <div class="modal-content" style="width: 400px;">
            <h2>Add Specific Event</h2>
            <form id="eventForm">
                <div class="form-group">
                    <label>Event Name</label>
                    <input type="text" id="e-title" class="form-control" placeholder="e.g. Pay Installment" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="e-date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="color" id="e-color" class="form-control color-picker" value="#ff3333" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Rename Category Modal -->
    <div id="renameModal" class="modal-overlay">
        <div class="modal-content" style="width: 400px;">
            <h2>Rename Calendar</h2>
            <form id="renameForm">
                <input type="hidden" id="r-old-name">
                <div class="form-group">
                    <label>New Name</label>
                    <input type="text" id="r-new-name" class="form-control" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Manager Modal -->
    <div id="managerModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Manage Habits</h2>
            
            <div id="manager-list" class="manager-list"></div>
            
            <div class="quick-add-task new-calendar-add">
                <span>+</span>
                <input type="text" placeholder="Add new calendar placeholder..." onkeypress="quickAddCalendar(event)">
            </div>

            <div class="modal-actions">
                <button class="btn btn-primary" onclick="closeModals(); renderTasks();">Close</button>
            </div>
        </div>
    </div>

    <!-- Richiama il file JS -->
    <script src="script.js"></script>
</body>
</html>
