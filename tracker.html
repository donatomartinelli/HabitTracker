<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Habit Tracker</title>
    <style>
        :root {
            --bg-main: #000000;
            --bg-sec: #0a0a0a;
            --text-main: #ffffff;
            --text-dim: #777777;
            --border-color: #222222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .layout { display: flex; width: 100%; height: 100%; }

        /* 40% Left Pane */
        .left-pane {
            flex: 4;
            border-right: 1px solid var(--border-color);
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* 60% Right Pane */
        .right-pane {
            flex: 6;
            background-color: var(--bg-sec);
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .header-buttons { display: flex; gap: 10px; }

        h1 { font-size: 2rem; font-weight: 600; border: none; padding: 0; margin: 0; }
        h2 { font-size: 1.2rem; font-weight: 500; color: #aaaaaa; margin-top: 40px; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; margin-bottom: 20px; }

        /* CALENDAR & TRACKER */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .calendar-header .nav-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1.2rem; }
        .calendar-header .nav-btn:hover { color: var(--text-main); }
        
        .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .day-label { font-size: 0.8rem; color: var(--text-dim); padding-bottom: 5px; }
        
        .month-day { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center; 
            border: 1px solid #151515; border-radius: 4px; font-size: 0.9rem; color: #555; 
            cursor: pointer; transition: 0.2s;
            font-weight: bold; /* Bold numbers as requested */
            position: relative;
        }
        .month-day.in-month { color: #ccc; border-color: #2a2a2a; }
        .month-day.in-month:hover { background-color: #1a1a1a; }
        
        /* White Dot Indicator for Events */
        .month-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: var(--text-main);
            border-radius: 50%;
        }

        /* Today border */
        .month-day.today { border: 1px solid var(--text-main); }
        
        /* Selected state (Full background) */
        .month-day.selected { background-color: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }
        
        /* Black Dot for Selected Event Days (Contrast) */
        .month-day.selected.has-event::after {
            background-color: var(--bg-main);
        }

        .tracker-wrapper { overflow-x: auto; padding-bottom: 10px; }
        .tracker-grid { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; gap: 4px; }
        .cell { width: 14px; height: 14px; border-radius: 2px; cursor: pointer; }
        .lvl-none { background: #0a0a0a; outline: 1px solid #1a1a1a; outline-offset: -1px; } 
        .lvl-0 { background: #1a1a1a; outline: 1px solid #333; outline-offset: -1px; } 
        .lvl-1 { background: #444444; } 
        .lvl-2 { background: #888888; } 
        .lvl-3 { background: #cccccc; } 
        .lvl-4 { background: #ffffff; box-shadow: 0 0 5px rgba(255,255,255,0.3); } 

        /* TO-DO LIST & HOVER ACTIONS */
        .category-group { margin-bottom: 40px; }
        
        .category-header-wrap { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #111; padding-bottom: 5px; }
        .category-title { text-transform: uppercase; font-size: 0.85rem; letter-spacing: 2px; color: var(--text-dim); }
        
        .action-btns { display: none; gap: 8px; }
        .category-header-wrap:hover .action-btns, .task-item:hover .action-btns { display: flex; }

        .icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .icon-btn:hover { color: var(--text-main); }
        .icon-btn.delete:hover { color: #ff5555; }

        .task-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #1a1a1a; }
        .task-left { display: flex; align-items: center; gap: 15px; flex: 1; }
        .task-title { font-size: 1.05rem; color: #eeeeee; }
        
        .btn-start-task { 
            background: transparent; border: 1px solid #333; color: #aaa; border-radius: 4px; padding: 4px 8px; 
            font-size: 0.8rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px; 
        }
        .btn-start-task:hover { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }

        .instances-container { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .check-box { width: 22px; height: 22px; border: 2px solid #444; background: transparent; cursor: pointer; border-radius: 4px; transition: all 0.2s ease; flex-shrink: 0;}
        .check-box:hover { border-color: #888; }
        .check-box.checked { background: var(--text-main); border-color: var(--text-main); }
        .empty-state { color: var(--text-dim); font-style: italic; margin-top: 20px; }

        /* QUICK ADD */
        .quick-add-task { display: flex; align-items: center; gap: 10px; padding: 12px 0; color: var(--text-dim); border-bottom: 1px solid transparent; }
        .quick-add-task span { font-size: 1.2rem; font-weight: bold; }
        .quick-add-task input { background: transparent; border: none; color: var(--text-main); font-size: 1rem; flex: 1; outline: none; font-family: inherit; }
        .quick-add-task input::placeholder { color: #444; }

        /* BUTTONS & FORMS */
        .btn { padding: 8px 16px; border: 1px solid var(--border-color); background: transparent; color: var(--text-main); cursor: pointer; border-radius: 4px; font-size: 0.9rem; transition: 0.2s; }
        .btn:hover { background: #222; }
        .btn-primary { background: var(--text-main); color: var(--bg-main); font-weight: bold; border: none; }
        .btn-primary:hover { background: #ccc; }

        /* MODALS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(3px); }
        .modal-content { background: var(--bg-main); border: 1px solid var(--border-color); padding: 30px; width: 450px; max-width: 90%; max-height: 90vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-content h2 { margin-top: 0; border: none; color: white; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-dim); }
        .form-control { width: 100%; background: var(--bg-sec); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 4px; font-family: inherit; }
        .form-control:focus { outline: none; border-color: #555; }
        
        .days-checkboxes { display: none; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .day-check { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; color: #ccc; }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; }

        /* MANAGER LIST */
        .manager-list { display: flex; flex-direction: column; gap: 20px; }
        .manager-category h3 { font-size: 1rem; color: var(--text-dim); border-bottom: 1px solid #222; padding-bottom: 5px; margin-bottom: 10px; }
        .manager-task { display: flex; justify-content: space-between; background: var(--bg-sec); padding: 10px; border-radius: 4px; margin-bottom: 5px; }

        /* POMODORO TIMER OVERLAY */
        .pomodoro-overlay {
            display: none; position: fixed; inset: 0; background: var(--bg-main);
            z-index: 500; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .progress-ring__circle {
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            stroke-dasharray: 1131; /* Circumference */
            stroke-dashoffset: 0;
        }

        .pomodoro-cancel { margin-top: 50px; color: var(--text-dim); cursor: pointer; font-size: 1rem; }
        .pomodoro-cancel:hover { color: white; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>

    <div class="layout">
        <!-- LEFT: 40% -->
        <div class="left-pane">
            <h1>Overview</h1>
            
            <div class="calendar-header">
                <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
                <span id="calendar-month-name">Month Year</span>
                <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
            </div>
            
            <div class="month-grid" id="calendar-grid"></div>

            <h2>Consistent Tracker</h2>
            <div class="tracker-wrapper">
                <div class="tracker-grid" id="github-tracker"></div>
            </div>
        </div>

        <!-- RIGHT: 60% -->
        <div class="right-pane">
            <div class="header-actions">
                <h1 id="selected-date-title">Today</h1>
                <div class="header-buttons">
                    <button class="btn" onclick="openManagerModal()" title="Manage all habits">⚙ Manage</button>
                    <button class="btn btn-primary" onclick="openFormModal()">+ New Habit</button>
                </div>
            </div>
            <div id="today-tasks"></div>
        </div>
    </div>

    <!-- Modals & Overlays -->
    
    <!-- Pomodoro Timer Overlay -->
    <div id="pomodoroOverlay" class="pomodoro-overlay">
        <svg class="progress-ring" width="400" height="400">
            <!-- Background track -->
            <circle stroke="#1a1a1a" stroke-width="12" fill="transparent" r="180" cx="200" cy="200" />
            <!-- Closing progress -->
            <circle id="pomodoro-circle" class="progress-ring__circle" stroke="#ffffff" stroke-width="12" fill="transparent" r="180" cx="200" cy="200" />
        </svg>
        <div class="pomodoro-cancel" onclick="stopPomodoro()">Click anywhere here to cancel</div>
    </div>

    <!-- Habit Form Modal -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Create New Habit</h2>
            <form id="habitForm">
                <input type="hidden" id="h-id">
                <div class="form-group">
                    <label>Category (Calendar)</label>
                    <input type="text" id="h-category" class="form-control" placeholder="e.g. Gym, Study..." required>
                </div>
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="h-title" class="form-control" placeholder="e.g. Math Session" required>
                </div>
                <div class="form-group">
                    <label>Daily repetitions</label>
                    <input type="number" id="h-instances" class="form-control" value="1" min="1" max="50" required>
                </div>
                <div class="form-group">
                    <label>Frequency</label>
                    <select id="h-frequency" class="form-control" onchange="toggleDays()">
                        <option value="all">Every day</option>
                        <option value="weekdays">Weekdays (Mon-Fri)</option>
                        <option value="weekends">Weekends (Sat-Sun)</option>
                        <option value="specific">Specific days</option>
                    </select>
                </div>
                <div class="form-group days-checkboxes" id="h-days-container">
                    <label class="day-check"><input type="checkbox" value="1"> Mon</label>
                    <label class="day-check"><input type="checkbox" value="2"> Tue</label>
                    <label class="day-check"><input type="checkbox" value="3"> Wed</label>
                    <label class="day-check"><input type="checkbox" value="4"> Thu</label>
                    <label class="day-check"><input type="checkbox" value="5"> Fri</label>
                    <label class="day-check"><input type="checkbox" value="6"> Sat</label>
                    <label class="day-check"><input type="checkbox" value="0"> Sun</label>
                </div>
                <div class="form-group">
                    <label>End date (optional)</label>
                    <input type="date" id="h-enddate" class="form-control">
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Manager Modal -->
    <div id="managerModal" class="modal-overlay">
        <div class="modal-content" style="width: 500px;">
            <h2>Manage Habits</h2>
            <div id="manager-list" class="manager-list"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="closeModals()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DATA MANAGEMENT ---
        function initData() {
            if (!localStorage.getItem('tracker_templates')) localStorage.setItem('tracker_templates', JSON.stringify([]));
            if (!localStorage.getItem('tracker_logs')) localStorage.setItem('tracker_logs', JSON.stringify({}));
        }

        initData();
        let templates = JSON.parse(localStorage.getItem('tracker_templates'));
        let logs = JSON.parse(localStorage.getItem('tracker_logs'));

        function saveData() {
            localStorage.setItem('tracker_templates', JSON.stringify(templates));
            localStorage.setItem('tracker_logs', JSON.stringify(logs));
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        const todayObj = new Date();
        const todayStr = formatDate(todayObj);
        
        let selectedDateStr = todayStr;
        let currentCalendarDate = new Date(todayObj.getFullYear(), todayObj.getMonth(), 1);

        function changeMonth(offset) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + offset);
            renderCalendar();
        }

        function isTaskActiveOnDate(template, dateStr) {
            if (dateStr < template.startDate) return false;
            if (template.endDate && dateStr > template.endDate) return false;
            
            const dateObj = new Date(dateStr);
            const dayOfWeek = dateObj.getDay();
            
            if (template.frequency === 'all') return true;
            if (template.frequency === 'weekdays' && dayOfWeek >= 1 && dayOfWeek <= 5) return true;
            if (template.frequency === 'weekends' && (dayOfWeek === 0 || dayOfWeek === 6)) return true;
            if (template.frequency === 'specific' && template.daysOfWeek.includes(dayOfWeek)) return true;
            return false;
        }

        function getStatsForDate(dateStr) {
            let total = 0, completed = 0;
            templates.forEach(t => {
                if (isTaskActiveOnDate(t, dateStr)) {
                    total += t.instances;
                    if (logs[dateStr] && logs[dateStr][t.id]) {
                        completed += logs[dateStr][t.id].filter(Boolean).length;
                    }
                }
            });
            return { total, completed };
        }

        // --- 2. ACTIONS (CRUD) ---

        function toggleTask(templateId, instanceIndex) {
            if (!logs[selectedDateStr]) logs[selectedDateStr] = {};
            if (!logs[selectedDateStr][templateId]) {
                const t = templates.find(x => x.id === templateId);
                logs[selectedDateStr][templateId] = Array(t.instances).fill(false);
            }
            logs[selectedDateStr][templateId][instanceIndex] = !logs[selectedDateStr][templateId][instanceIndex];
            saveData();
            renderTasks();
            renderTracker();
        }

        function quickAddTask(event, categoryName) {
            if (event.key === 'Enter') {
                const title = event.target.value.trim();
                if (!title) return;

                const newHabit = {
                    id: 't_' + Date.now(),
                    category: categoryName,
                    title: title,
                    instances: 1, 
                    frequency: 'all',
                    daysOfWeek: [],
                    startDate: selectedDateStr, 
                    endDate: null
                };
                templates.push(newHabit);
                saveData();
                renderTasks();
                renderTracker();
                renderCalendar(); 
            }
        }

        function editTask(id) {
            const t = templates.find(x => x.id === id);
            if(!t) return;
            
            document.getElementById('h-id').value = t.id;
            document.getElementById('h-category').value = t.category;
            document.getElementById('h-title').value = t.title;
            document.getElementById('h-instances').value = t.instances;
            document.getElementById('h-frequency').value = t.frequency;
            document.getElementById('h-enddate').value = t.endDate || "";
            
            toggleDays();
            if(t.frequency === 'specific') {
                document.querySelectorAll('#h-days-container input').forEach(cb => {
                    cb.checked = t.daysOfWeek.includes(parseInt(cb.value));
                });
            }
            
            document.getElementById('modal-title').innerText = "Edit Habit";
            closeModals();
            document.getElementById('formModal').style.display = 'flex';
        }

        function deleteTask(id) {
            if(confirm("Are you sure you want to permanently delete this task?")) {
                templates = templates.filter(t => t.id !== id);
                saveData();
                renderTasks();
                renderTracker();
                renderCalendar();
                renderManager(); 
            }
        }

        function renameCategory(oldName) {
            const newName = prompt(`Rename calendar "${oldName}" to:`, oldName);
            if (newName && newName.trim() !== "" && newName !== oldName) {
                templates.forEach(t => {
                    if (t.category === oldName) t.category = newName.trim();
                });
                saveData();
                renderTasks();
                renderManager();
            }
        }

        function deleteCategory(catName) {
            if(confirm(`Are you sure you want to delete the ENTIRE calendar "${catName}"?`)) {
                templates = templates.filter(t => t.category !== catName);
                saveData();
                renderTasks();
                renderTracker();
                renderCalendar();
                renderManager();
            }
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar(); 
            renderTasks();    
        }

        // --- 3. POMODORO TIMER ---
        let pomodoroInterval;
        const POMODORO_SECONDS = 25 * 60; // 25 Minutes

        function startPomodoro() {
            document.getElementById('pomodoroOverlay').style.display = 'flex';
            const circle = document.getElementById('pomodoro-circle');
            const circumference = 2 * Math.PI * 180; // 1130.97
            
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            
            let timeLeft = POMODORO_SECONDS;
            clearInterval(pomodoroInterval);
            
            pomodoroInterval = setInterval(() => {
                timeLeft--;
                const percent = timeLeft / POMODORO_SECONDS;
                circle.style.strokeDashoffset = circumference - (percent * circumference);
                
                if (timeLeft <= 0) {
                    clearInterval(pomodoroInterval);
                    setTimeout(() => alert("Focus session complete!"), 100);
                    stopPomodoro();
                }
            }, 1000);
        }

        function stopPomodoro() {
            clearInterval(pomodoroInterval);
            document.getElementById('pomodoroOverlay').style.display = 'none';
        }

        // --- 4. RENDER ---

        function renderTasks() {
            const titleEl = document.getElementById('selected-date-title');
            
            if (selectedDateStr === todayStr) {
                titleEl.innerText = "Today";
            } else {
                const parts = selectedDateStr.split('-');
                const d = new Date(parts[0], parts[1] - 1, parts[2]);
                const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
                titleEl.innerText = `${days[d.getDay()]} ${d.getDate()}`;
            }

            const container = document.getElementById('today-tasks');
            container.innerHTML = '';

            const categories = {};
            templates.forEach(t => { if (!categories[t.category]) categories[t.category] = []; });

            for (const cat in categories) {
                const activeTasks = templates.filter(t => t.category === cat && isTaskActiveOnDate(t, selectedDateStr));
                
                if (activeTasks.length > 0 || templates.some(t => t.category === cat)) {

                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'category-group';
                    
                    groupDiv.innerHTML = `
                        <div class="category-header-wrap">
                            <div class="category-title">${cat}</div>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="renameCategory('${cat}')" title="Rename Calendar">✎</button>
                                <button class="icon-btn delete" onclick="deleteCategory('${cat}')" title="Delete Calendar">×</button>
                            </div>
                        </div>
                    `;

                    activeTasks.forEach(t => {
                        const taskItem = document.createElement('div');
                        taskItem.className = 'task-item';
                        
                        const currentLog = (logs[selectedDateStr] && logs[selectedDateStr][t.id]) || Array(t.instances).fill(false);
                        
                        let checkboxesHTML = '';
                        for (let i = 0; i < t.instances; i++) {
                            checkboxesHTML += `<div class="check-box ${currentLog[i] ? 'checked' : ''}" onclick="toggleTask('${t.id}', ${i})"></div>`;
                        }

                        taskItem.innerHTML = `
                            <div class="task-left">
                                <div class="task-title">${t.title}</div>
                                <button class="btn-start-task" onclick="startPomodoro()" title="Start Pomodoro Timer">▶ Start task</button>
                                <div class="action-btns">
                                    <button class="icon-btn" onclick="editTask('${t.id}')">✎</button>
                                    <button class="icon-btn delete" onclick="deleteTask('${t.id}')">×</button>
                                </div>
                            </div>
                            <div class="instances-container">${checkboxesHTML}</div>
                        `;
                        groupDiv.appendChild(taskItem);
                    });

                    const quickAdd = document.createElement('div');
                    quickAdd.className = 'quick-add-task';
                    quickAdd.innerHTML = `
                        <span>+</span>
                        <input type="text" placeholder="Add task to ${cat}..." onkeypress="quickAddTask(event, '${cat}')">
                    `;
                    groupDiv.appendChild(quickAdd);

                    container.appendChild(groupDiv);
                }
            }

            if (Object.keys(categories).length === 0) {
                container.innerHTML = `<div class="empty-state">No habits created yet. Click "+ New Habit" to begin.</div>`;
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendar-month-name').innerText = `${monthNames[currentCalendarDate.getMonth()]} ${currentCalendarDate.getFullYear()}`;
            
            grid.innerHTML = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'].map(d => `<div class="day-label">${d}</div>`).join('');

            const firstDay = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth(), 1);
            const lastDay = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth() + 1, 0);
            let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

            for (let i = 0; i < startOffset; i++) grid.innerHTML += `<div class="month-day"></div>`;
            
            for (let i = 1; i <= lastDay.getDate(); i++) {
                const cellDate = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth(), i);
                const cellDateStr = formatDate(cellDate);
                const stats = getStatsForDate(cellDateStr);
                
                const dayCell = document.createElement('div');
                dayCell.className = 'month-day in-month';
                
                if (cellDateStr === todayStr) dayCell.classList.add('today');
                if (cellDateStr === selectedDateStr) dayCell.classList.add('selected');
                
                // Add dot indicator if there are tasks assigned to this day
                if (stats.total > 0) dayCell.classList.add('has-event');
                
                dayCell.innerText = i;
                dayCell.onclick = () => selectDate(cellDateStr);
                
                grid.appendChild(dayCell);
            }
        }

        function renderTracker() {
            const tracker = document.getElementById('github-tracker');
            tracker.innerHTML = '';
            const daysToRender = 364; 
            const startDate = new Date(todayObj);
            startDate.setDate(todayObj.getDate() - daysToRender + 1); 
            
            for (let i = 0; i < daysToRender; i++) {
                const d = new Date(startDate);
                d.setDate(startDate.getDate() + i);
                const dateStr = formatDate(d);
                const stats = getStatsForDate(dateStr);
                
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.title = `${dateStr} - ${stats.completed}/${stats.total} completed`; 
                cell.onclick = () => selectDate(dateStr);

                if (stats.total === 0) cell.classList.add('lvl-none');
                else {
                    const p = stats.completed / stats.total;
                    if (p === 0) cell.classList.add('lvl-0');
                    else if (p < 0.4) cell.classList.add('lvl-1');
                    else if (p < 0.75) cell.classList.add('lvl-2');
                    else if (p < 1) cell.classList.add('lvl-3');
                    else cell.classList.add('lvl-4');
                }
                tracker.appendChild(cell);
            }
        }

        function renderManager() {
            const container = document.getElementById('manager-list');
            container.innerHTML = '';
            
            const cats = {};
            templates.forEach(t => {
                if(!cats[t.category]) cats[t.category] = [];
                cats[t.category].push(t);
            });

            for(const cat in cats) {
                let html = `<div class="manager-category"><h3>${cat}</h3>`;
                cats[cat].forEach(t => {
                    html += `
                        <div class="manager-task">
                            <span>${t.title} (${t.instances}x)</span>
                            <div class="action-btns" style="display:flex;">
                                <button class="icon-btn" onclick="editTask('${t.id}')">✎</button>
                                <button class="icon-btn delete" onclick="deleteTask('${t.id}')">×</button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML += html;
            }
        }

        // --- 5. MODALS MANAGEMENT ---

        function openFormModal() {
            document.getElementById('habitForm').reset();
            document.getElementById('h-id').value = ""; 
            document.getElementById('modal-title').innerText = "Create New Habit";
            toggleDays();
            closeModals();
            document.getElementById('formModal').style.display = 'flex';
        }

        function openManagerModal() {
            renderManager();
            closeModals();
            document.getElementById('managerModal').style.display = 'flex';
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        }

        function toggleDays() {
            const freq = document.getElementById('h-frequency').value;
            document.getElementById('h-days-container').style.display = (freq === 'specific') ? 'flex' : 'none';
        }

        document.getElementById('habitForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('h-id').value;
            const category = document.getElementById('h-category').value.trim();
            const title = document.getElementById('h-title').value.trim();
            const instances = parseInt(document.getElementById('h-instances').value, 10);
            const frequency = document.getElementById('h-frequency').value;
            let endDate = document.getElementById('h-enddate').value || null;
            
            let daysOfWeek = [];
            if (frequency === 'specific') {
                document.querySelectorAll('#h-days-container input:checked').forEach(cb => daysOfWeek.push(parseInt(cb.value)));
                if (daysOfWeek.length === 0) { alert("Please select at least one day!"); return; }
            }

            if (id) {
                const t = templates.find(x => x.id === id);
                t.category = category; t.title = title; t.instances = instances;
                t.frequency = frequency; t.daysOfWeek = daysOfWeek; t.endDate = endDate;
            } else {
                templates.push({
                    id: 't_' + Date.now(), category, title, instances, frequency, daysOfWeek, startDate: selectedDateStr, endDate
                });
            }

            saveData();
            closeModals();
            renderTasks();
            renderTracker();
            renderCalendar();
        });

        // STARTUP
        renderTasks(); 
        renderCalendar();
        renderTracker();

    </script>
</body>
</html>
