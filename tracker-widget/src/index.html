<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Habit Tracker</title>
    <!-- Richiama il file CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="layout">
        <!-- LEFT: 40% -->
        <div class="left-pane" data-tauri-drag-region>
            <div class="calendar-section">
                <h1>Overview</h1>
                <br>
                <div class="calendar-header">
                    <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
                    <span id="calendar-month-name">Month Year</span>
                    <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
                </div>
                
                <div class="month-grid" id="calendar-grid"></div>
            </div>

            <!-- QUICK NOTES (Salvataggio con Enter) -->
            <div class="notes-section">
                <div class="notes-controls">
                    <h2 style="margin: 0; color: var(--text-main); border: none; padding: 0;">Quick Notes</h2>
                    <div style="display: flex; gap: 5px; align-items: center;">
                        <select id="note-category" class="form-control" style="width: 160px; padding: 4px; font-weight: bold;"></select>
                        <button class="btn" onclick="openManageNotesModal()" title="Manage Categories">⚙ Manage</button>
                    </div>
                </div>
                <div style="display: flex; height: 100%;">
                    <textarea id="note-text" class="form-control" style="flex: 1; resize: none; font-family: inherit; font-size: 0.9rem;" placeholder="Write your idea and press Enter..." onkeydown="handleNoteKeyDown(event)"></textarea>
                </div>
            </div>
        </div>

        <!-- RIGHT: 60% -->
        <div class="right-pane">
            
            <div data-tauri-drag-region style="position: absolute; top: 0; left: 0; width: calc(100% - 60px); height: 40px; z-index: 40; cursor: grab; background: rgba(0,0,0,0.01);"></div>
            <button id="btn-close-app" style="position: absolute; top: 10px; right: 20px; background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 1.2rem; z-index: 50;">✕</button>
            
            <!-- AGENDA -->
            <div class="agenda-section">
                <div class="header-actions">
                    <h1 id="selected-date-title">Today</h1>
                    <div class="header-buttons">
                        <button class="btn btn-primary" onclick="openTimerModal()">▶ Focus</button>
                        <button class="btn btn-event" onclick="openEventModal()">+ Event</button>
                        <button class="btn" onclick="openManagerModal()">⚙ Manage</button>
                        <button class="btn btn-primary" onclick="openFormModal()">+ New Habit</button>
                    </div>
                </div>
                <div id="today-tasks"></div>
            </div>

            <!-- BARRA DI RIDIMENSIONAMENTO / TENDINA -->
            <div id="tracker-resizer" class="resizer-horizontal" title="Drag to resize / Double-click to toggle"></div>

            <!-- TRACKER (Senza intestazione 'Consistency') -->
            <div id="tracker-section" class="tracker-section">
                <div class="tracker-wrapper">
                    <div class="tracker-grid" id="github-tracker"></div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- MODALS & OVERLAYS -->
    
    <!-- Pomodoro Timer Overlay -->
    <div id="pomodoroOverlay" class="pomodoro-overlay">
        <svg class="progress-ring" width="400" height="400">
            <circle stroke="#111" stroke-width="4" fill="transparent" r="180" cx="200" cy="200" />
            <circle id="pomodoro-circle" class="progress-ring__circle" stroke="#ffffff" stroke-width="4" fill="transparent" r="180" cx="200" cy="200" />
        </svg>
        <div class="pomodoro-cancel" onclick="stopPomodoro()">Click anywhere to abort</div>
    </div>

    <!-- Timer Setup Modal -->
    <div id="timerSetupModal" class="modal-overlay">
        <div class="modal-content" style="width: 350px;">
            <h2>Focus Session</h2>
            <form id="timerSetupForm">
                <div class="form-group">
                    <label>Duration (Minutes)</label>
                    <input type="number" id="tmr-minutes" class="form-control" value="25" min="1" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Start Timer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Timer Complete Modal -->
    <div id="timerCompleteModal" class="modal-overlay">
        <div class="modal-content" style="width: 400px;">
            <h2>Session Complete!</h2>
            <p style="color: var(--text-dim); margin-bottom: 15px;">Select a task to check off:</p>
            <div id="uncompleted-tasks-list" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;"></div>
            <div class="modal-actions">
                <button type="button" class="btn" onclick="closeModals()">Skip</button>
            </div>
        </div>
    </div>

    <!-- Habit Form Modal -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Create New Habit</h2>
            <form id="habitForm">
                <input type="hidden" id="h-id">
                <div class="form-group">
                    <label>Category (Calendar)</label>
                    <input type="text" id="h-category" class="form-control" placeholder="e.g. GYM, STUDY" required>
                </div>
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="h-title" class="form-control" placeholder="e.g. Math Session" required>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Repetitions</label>
                        <input type="number" id="h-instances" class="form-control" value="1" min="1" max="50" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Default Timer (min)</label>
                        <input type="number" id="h-timer" class="form-control" value="25" min="1" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Frequency</label>
                    <select id="h-frequency" class="form-control" onchange="toggleDays()">
                        <option value="all">Every day</option>
                        <option value="weekdays">Weekdays (Mon-Fri)</option>
                        <option value="weekends">Weekends (Sat-Sun)</option>
                        <option value="specific">Specific days</option>
                    </select>
                </div>
                <div class="form-group days-checkboxes" id="h-days-container">
                    <label class="day-check"><input type="checkbox" value="1"> Mon</label>
                    <label class="day-check"><input type="checkbox" value="2"> Tue</label>
                    <label class="day-check"><input type="checkbox" value="3"> Wed</label>
                    <label class="day-check"><input type="checkbox" value="4"> Thu</label>
                    <label class="day-check"><input type="checkbox" value="5"> Fri</label>
                    <label class="day-check"><input type="checkbox" value="6"> Sat</label>
                    <label class="day-check"><input type="checkbox" value="0"> Sun</label>
                </div>
                <div class="form-group">
                    <label>End date (optional)</label>
                    <input type="date" id="h-enddate" class="form-control">
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Specific Event Modal -->
    <div id="eventModal" class="modal-overlay">
        <div class="modal-content" style="width: 400px;">
            <h2>Add Specific Event</h2>
            <form id="eventForm">
                <div class="form-group">
                    <label>Event Name</label>
                    <input type="text" id="e-title" class="form-control" placeholder="e.g. Pay Installment" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="e-date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <div class="color-palette" id="event-color-palette">
                        <div class="color-circle active" style="background: #b84b4b;" data-color="#b84b4b" onclick="selectColor(this)"></div>
                        <div class="color-circle" style="background: #5f7a61;" data-color="#5f7a61" onclick="selectColor(this)"></div>
                        <div class="color-circle" style="background: #4c5b73;" data-color="#4c5b73" onclick="selectColor(this)"></div>
                        <div class="color-circle" style="background: #b08d43;" data-color="#b08d43" onclick="selectColor(this)"></div>
                        <div class="color-circle" style="background: #725b7a;" data-color="#725b7a" onclick="selectColor(this)"></div>
                        <div class="color-circle" style="background: #6e7073;" data-color="#6e7073" onclick="selectColor(this)"></div>
                        <div class="color-circle custom-color-btn" onclick="document.getElementById('e-color').click()">+</div>
                    </div>
                    <!-- Input nativo nascosto -->
                    <input type="color" id="e-color" style="display: none;" value="#b84b4b" onchange="updateCustomColor(this)">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Rename Category Modal -->
    <div id="renameModal" class="modal-overlay">
        <div class="modal-content" style="width: 400px;">
            <h2>Rename Calendar</h2>
            <form id="renameForm">
                <input type="hidden" id="r-old-name">
                <div class="form-group">
                    <label>New Name</label>
                    <input type="text" id="r-new-name" class="form-control" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Manager Modal -->
    <div id="managerModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Manage Habits</h2>
            
            <div id="manager-list" class="manager-list"></div>
            
            <div class="quick-add-task new-calendar-add">
                <span>+</span>
                <input type="text" placeholder="Add new calendar..." onkeypress="quickAddCalendar(event)">
            </div>

            <div class="modal-actions">
                <button class="btn btn-primary" onclick="closeModals(); renderTasks();">Close</button>
            </div>
        </div>
    </div>

    <!-- NUOVO MODALE: Manage Notes Modal -->
    <div id="manageNotesModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Manage Note Categories</h2>
            
            <div id="notes-manager-list" class="manager-list"></div>
            
            <div class="quick-add-task new-calendar-add">
                <span>+</span>
                <input type="text" placeholder="Add new category..." onkeypress="quickAddNoteCategory(event)">
            </div>

            <div class="modal-actions">
                <button class="btn btn-primary" onclick="closeModals(); renderNoteCategories();">Close</button>
            </div>
        </div>
    </div>

    <!-- Advanced Delete Modal -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-content" style="width: 450px;">
            <h2 id="delete-modal-title">Delete Options</h2>
            <p style="color: var(--text-dim); margin-bottom: 20px;">What do you want to do with <strong style="color: white;" id="delete-target-name"></strong>?</p>
            
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn" style="text-align: left; padding: 15px;" onclick="confirmDelete('single')">
                    <strong>Delete for this day only</strong><br>
                    <span style="font-size: 0.8rem; color: var(--text-dim); text-transform: none;">Removes it from the selected date without affecting history.</span>
                </button>
                <button class="btn" style="text-align: left; padding: 15px;" onclick="confirmDelete('future')">
                    <strong>Delete this and following</strong><br>
                    <span style="font-size: 0.8rem; color: var(--text-dim); text-transform: none;">Keeps past data, stops scheduling from the selected date.</span>
                </button>
                <button class="btn" style="text-align: left; padding: 15px; border-color: #552222; color: #ff6666;" onclick="confirmDelete('all')">
                    <strong>Delete completely</strong><br>
                    <span style="font-size: 0.8rem; color: var(--text-dim); text-transform: none;">Permanently wipes this from the database entirely.</span>
                </button>
            </div>
            
            <div class="modal-actions">
                <button class="btn" onclick="closeModals()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Richiama il file JS -->
    <script src="script.js"></script>
</body>
</html>
